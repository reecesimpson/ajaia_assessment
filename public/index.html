<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SidelineReel — Reel Editor</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▶</span>
    <span class="brand-name">SidelineReel</span>
    <span class="brand-sep">/</span>
    <span class="brand-page">Reel Editor</span>
  </div>

  <div class="player-chip">
    <span class="jersey">#14</span>
    <div class="player-meta">
      <div class="player-name">Maya Thompson</div>
      <div class="player-team">Ridgeline Youth Soccer &middot; Week 6 Recap</div>
    </div>
  </div>

  <div class="topbar-actions">
    <button id="playReelBtn" class="btn btn-ghost">▶ Play Reel</button>
    <button id="downloadBtn" class="btn btn-primary">⬇ Download Reel</button>
  </div>
</header>

<main class="layout">

  <section class="main-pane" id="mainPane">
    <div class="video-wrap">
      <video id="mainVideo" playsinline></video>
      <div class="video-overlay-label" id="videoLabel">Select a clip to preview, or press Play Reel</div>
    </div>

    <div class="editor-panel" id="editorPanel" hidden>
      <div class="editor-header">
        <div>
          <div class="editor-title" id="editorClipLabel">Clip</div>
          <div class="editor-sub" id="editorClipMeta">0:00 – 0:00</div>
        </div>
        <button class="btn btn-text" id="closeEditorBtn">Close</button>
      </div>

      <div class="trim-controls">
        <label class="trim-row">
          <span>Start</span>
          <input type="range" id="trimStart" min="0" max="100" value="0" step="0.1" />
          <span class="trim-value" id="trimStartVal">0.0s</span>
        </label>
        <label class="trim-row">
          <span>End</span>
          <input type="range" id="trimEnd" min="0" max="100" value="100" step="0.1" />
          <span class="trim-value" id="trimEndVal">0.0s</span>
        </label>
      </div>

      <div class="editor-actions">
        <button class="btn btn-primary" id="saveTrimBtn">Save Trim</button>
        <button class="btn btn-ghost" id="resetTrimBtn">Reset to Original</button>
      </div>
    </div>
  </section>

  <aside class="side-pane" id="sidePane">
    <div class="side-header">
      <h2>Clips in this reel</h2>
      <span class="side-sub" id="clipCount"></span>
    </div>

    <div class="clip-list" id="clipList"></div>

    <div class="flagged-section" id="flaggedSection" hidden>
      <h3>Flagged for review</h3>
      <p class="flagged-hint">Sent to the SidelineReel team to help retrain player identification.</p>
      <ul id="flaggedList"></ul>
    </div>

    <button class="btn btn-text reset-all" id="resetAllBtn">Restore defaults</button>
  </aside>

</main>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
